name: App Factory APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Use Persistent 10000-Day Signing Certificate (Unified Key For Seamless Updates)
        run: |
          mkdir -p ~/.android
          if [ -f "app/release-key.jks" ]; then
            cp app/release-key.jks ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore app/release-key.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=AppFactory,C=US"
            cp app/release-key.jks ~/.android/debug.keystore
          fi

      - name: Build APK (10000 Days Validity)
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk com_studio_appfactory.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppFactory-APK
          path: com_studio_appfactory.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-1792937619724
          name: "App Factory (4.0.0)"
          files: com_studio_appfactory.apk